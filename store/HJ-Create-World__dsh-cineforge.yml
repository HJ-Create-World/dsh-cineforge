name: HJ-Create-World/dsh-cineforge

# category 选 skill 而非 workflow：
# 本插件至今的实际交付物是经 ctx.skills.register 注册的 3 个对话内技能
# （cineforge-director / cineforge-cards / cineforge-qa）+ 1 个健康工具 cineforge_health，
# 另加一个侧栏工作台面板（不改变用户在市场上的主要入口）。
# 用户侧第一入口仍是「技能」，故 skill 最接近。
# workflow 指自动化多步流水线；11 阶段流水线目前是带硬确认门的设计 / 技能状态机，
# 且尚无发布闭环，不宜按 workflow 归类。
# 分类不会被打回，维护者可直接改；合法值之一：skill / workflow。
category: skill

# description.en：唯一必填；一句功能陈述、句号结尾、无营销词、不含未实现功能宣称。
# 「three」= skills/cineforge-* 三个技能目录 + lib/index.js 的 ctx.skills.register；
# 「a health tool」= cineforge_health；「compiles storyboard JSON」= scripts/compile-hf.mjs；
# 「sidebar workbench」= lib/client.js（sidebar.panellist + main 槽）与 lib/server/ 的 20 条端点。
description.en: Registers three in-chat DSH skills and a health tool, compiles storyboard JSON into a renderable HyperFrames project, and ships a sidebar workbench for storyboard editing, animatic previews, reference-video analysis and reusable templates.

# description.zh：可选；缺翻译由维护者补，不是打回理由。
description.zh: 注册 3 个对话内 DSH 技能与 1 个健康自检工具，把分镜 JSON 编译成可渲染的 HyperFrames 工程，并提供侧栏工作台（分镜编辑、animatic 预览、参考片分析、模板复用）。

