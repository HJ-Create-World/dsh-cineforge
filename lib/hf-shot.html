    <section id="shot-{{IDX}}" class="clip shot"
      data-start="{{START}}" data-duration="{{DUR}}"
      data-track-index="{{TRACK}}" data-card-id="{{CARD_ID}}"
      data-primitive="{{PRIMITIVE}}" data-category="{{CATEGORY}}"
      data-energy="{{ENERGY}}">
      <div id="shot-{{IDX}}-grid" class="shot__grid"></div>
      <div class="shot__bg"></div>
      <div class="shot__edge">{{N}} / {{TOTAL}}</div>
      <div id="shot-{{IDX}}-body" class="shot__body">
        <div class="shot__eyebrow">{{N}}  ·  {{CATEGORY_UPPER}}</div>
        <h1 class="shot__title">{{TITLE}}</h1>
        <p class="shot__sub">{{SUB}}</p>
        <p class="shot__foot">{{FOOT}}</p>
      </div>
      <div class="shot__bar"><span></span></div>
    </section>
